name: Validate conversion engine
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: |
          node --check src/app.js
          node --check src/geometry.js
          node --check src/straightening.js
          node --check src/hatch.js
          node --check src/hatch-repair.js
          node --check src/circles.js
          node --check src/linetype.js
          node --check src/tile-engine.js
          node --check src/viewport.js
          node --check src/dxf.js
          node --check src/dimensions.js
          node --check src/dimension-ui.js
          node --check src/repair.js
          node --check src/repair-ui.js
          node --check src/vector-worker.js
          node --check studio-preview/studio.js
      - name: Test local conversion core
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently validate DXF with ezdxf
        run: |
          python -m pip install ezdxf==1.4.5
          python tests/validate-dxf.py
